<svg viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080e1c"/>
      <stop offset="50%" stop-color="#0f1c36"/>
      <stop offset="100%" stop-color="#162947"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="520" rx="16" fill="url(#skyGrad)"/>
  <rect width="800" height="520" rx="16" stroke="rgba(148,163,184,0.15)" stroke-width="2"/>

  <!-- Stars / Digital Grid -->
  <g opacity="0.15">
    <line x1="40" y1="0" x2="40" y2="520" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="160" y1="0" x2="160" y2="520" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="280" y1="0" x2="280" y2="520" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="400" y1="0" x2="400" y2="520" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="520" y1="0" x2="520" y2="520" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="640" y1="0" x2="640" y2="520" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="760" y1="0" x2="760" y2="520" stroke="#38bdf8" stroke-dasharray="4 6"/>
  </g>

  <!-- Atmosphere & Radar Waves (Top Right) -->
  <circle cx="700" cy="90" r="120" stroke="rgba(56,189,248,0.1)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="700" cy="90" r="80" stroke="rgba(56,189,248,0.2)" stroke-width="1.5"/>
  <circle cx="700" cy="90" r="40" stroke="rgba(56,189,248,0.35)" stroke-width="2"/>
  <circle cx="700" cy="90" r="8" fill="#38bdf8" filter="url(#glowEffect)"/>
  <text x="700" y="125" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">RADAR BMKG DOPPLER</text>

  <!-- Mountain Silhouette / Backdrop (Bandung & Java terrain) -->
  <path d="M0 340 L120 270 L260 320 L420 240 L580 310 L720 260 L800 300 L800 480 L0 480 Z" fill="#0c172d" opacity="0.6"/>

  <!-- City Skyline Silhouette (Modern Indonesian Urban Center) -->
  <!-- Tower 1 -->
  <rect x="80" y="240" width="48" height="180" rx="4" fill="#142340"/>
  <rect x="88" y="250" width="8" height="12" fill="#38bdf8" opacity="0.4"/>
  <rect x="108" y="250" width="8" height="12" fill="#38bdf8" opacity="0.4"/>
  <rect x="88" y="270" width="8" height="12" fill="#38bdf8" opacity="0.4"/>
  <rect x="108" y="270" width="8" height="12" fill="#34d399" opacity="0.5"/>
  <!-- Green Roof (Resilience Element) -->
  <rect x="76" y="234" width="56" height="8" rx="3" fill="#10b981"/>
  <text x="104" y="224" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Atap Hijau (Retensi Hujan)</text>

  <!-- Tower 2 (High Rise Center) -->
  <rect x="160" y="170" width="70" height="250" rx="6" fill="#182c52"/>
  <line x1="195" y1="130" x2="195" y2="170" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="195" cy="130" r="4" fill="#38bdf8" filter="url(#glowEffect)"/>
  <!-- Grid Windows -->
  <g fill="#93c5fd" opacity="0.3">
    <rect x="172" y="190" width="10" height="14" rx="2"/>
    <rect x="190" y="190" width="10" height="14" rx="2"/>
    <rect x="208" y="190" width="10" height="14" rx="2"/>
    <rect x="172" y="220" width="10" height="14" rx="2"/>
    <rect x="190" y="220" width="10" height="14" rx="2"/>
    <rect x="208" y="220" width="10" height="14" rx="2"/>
    <rect x="172" y="250" width="10" height="14" rx="2"/>
    <rect x="190" y="250" width="10" height="14" rx="2"/>
    <rect x="208" y="250" width="10" height="14" rx="2"/>
  </g>

  <!-- Tower 3 -->
  <rect x="250" y="220" width="52" height="200" rx="4" fill="#142340"/>
  <rect x="258" y="235" width="10" height="14" fill="#38bdf8" opacity="0.3"/>
  <rect x="278" y="235" width="10" height="14" fill="#38bdf8" opacity="0.3"/>

  <!-- Urban Drainage & Water Retention Basin (Waduk Retensi Kota) -->
  <path d="M340 370 Q440 350 560 375 L550 430 Q430 450 330 430 Z" fill="url(#waterGrad)"/>
  <text x="445" y="405" fill="#e0f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Waduk Pengendali Limpasan DAS</text>

  <!-- Permeable Pavement / Road Base -->
  <rect x="0" y="420" width="800" height="100" fill="#0b1324"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#0ea5e9" stroke-width="2" opacity="0.4"/>

  <!-- Smart IoT Weather Sensor Nodes -->
  <!-- Node A -->
  <g transform="translate(360, 310)">
    <circle cx="0" cy="0" r="16" fill="rgba(14,165,233,0.2)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
    <line x1="0" y1="16" x2="0" y2="70" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-55" y="-38" width="110" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="0" y="-22" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Sensor Curah Hujan</text>
  </g>

  <!-- Node B (Air Quality Sensor) -->
  <g transform="translate(620, 270)">
    <circle cx="0" cy="0" r="16" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#10b981"/>
    <line x1="0" y1="16" x2="0" y2="120" stroke="#10b981" stroke-width="2"/>
    <rect x="-55" y="-38" width="110" height="24" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="0" y="-22" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Sensor Kualitas ISPU</text>
  </g>

  <!-- Wireless Link Arcs -->
  <path d="M360 310 Q480 200 620 270" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7"/>
  <path d="M620 270 Q660 170 700 90" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7"/>

  <!-- Central KotaTangguh Intelligence Hub Box -->
  <g transform="translate(40, 40)">
    <rect width="260" height="84" rx="10" fill="rgba(12, 19, 34, 0.9)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="8" fill="#10b981" filter="url(#glowEffect)"/>
    <text x="46" y="32" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">KotaTangguh Core 2026</text>
    <text x="24" y="58" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Integrasi BMKG Open Data + CAMS AQI</text>
    <text x="24" y="74" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Status: Real-time Multi-Sensors Live</text>
  </g>

  <!-- SDG 11 & SDG 13 Footer Tag inside SVG -->
  <g transform="translate(40, 465)">
    <rect width="210" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="105" y="483" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">SDG 11 Kota Cerdas &amp; SDG 13 Iklim</text>
  </g>
</svg>

