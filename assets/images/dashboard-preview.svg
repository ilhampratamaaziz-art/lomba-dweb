<svg viewBox="0 0 1000 580" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141f36"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chartLineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Container Window Frame -->
  <rect width="1000" height="580" rx="16" fill="#080d1a" stroke="rgba(148,163,184,0.2)" stroke-width="2"/>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1000" height="52" fill="#0c1322"/>
  <circle cx="28" cy="26" r="6" fill="#ef4444"/>
  <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="26" r="6" fill="#10b981"/>
  
  <rect x="110" y="14" width="300" height="24" rx="6" fill="#162238"/>
  <text x="130" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">🔍 Jakarta Pusat — Gambir, DKI Jakarta</text>

  <!-- Live Status Badge -->
  <rect x="830" y="14" width="140" height="24" rx="12" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
  <circle cx="845" cy="26" r="4" fill="#10b981"/>
  <text x="860" y="30" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">BMKG LIVE FEED</text>

  <!-- Main Grid Layout -->
  <!-- Left Column: Official BMKG Weather Card -->
  <g transform="translate(30, 74)">
    <rect width="455" height="240" rx="12" fill="url(#cardGrad)" stroke="rgba(148,163,184,0.15)"/>
    <text x="24" y="34" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Prakiraan Resmi BMKG</text>
    <rect x="330" y="18" width="100" height="22" rx="4" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)"/>
    <text x="380" y="33" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">KODE 31.71</text>

    <!-- Main Temp & Icon -->
    <text x="24" y="105" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="800">30°C</text>
    <text x="24" y="132" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Berawan Sebagian</text>
    
    <!-- Mini Weather Icon -->
    <circle cx="390" cy="85" r="30" fill="#fbbf24" opacity="0.9"/>
    <path d="M360 100 Q370 85 390 90 Q405 85 415 95 Q425 100 420 110 L355 110 Z" fill="#94a3b8"/>

    <!-- 4 Sub Metrics -->
    <rect x="24" y="156" width="95" height="60" rx="8" fill="#162238"/>
    <text x="34" y="176" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">KELEMBAPAN</text>
    <text x="34" y="200" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">70%</text>

    <rect x="129" y="156" width="95" height="60" rx="8" fill="#162238"/>
    <text x="139" y="176" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">ANGIN</text>
    <text x="139" y="200" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">7.1 km/h</text>

    <rect x="234" y="156" width="95" height="60" rx="8" fill="#162238"/>
    <text x="244" y="176" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">CURAH HUJAN</text>
    <text x="244" y="200" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">0.0 mm</text>

    <rect x="339" y="156" width="95" height="60" rx="8" fill="#162238"/>
    <text x="349" y="176" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">TUTUPAN AWAN</text>
    <text x="349" y="200" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">99%</text>
  </g>

  <!-- Right Column: IKH Gauge & Air Quality Card -->
  <g transform="translate(515, 74)">
    <rect width="455" height="240" rx="12" fill="url(#cardGrad)" stroke="rgba(148,163,184,0.15)"/>
    <text x="24" y="34" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Indikator Kewaspadaan Hujan (IKH)</text>

    <!-- Gauge Ring -->
    <circle cx="85" cy="115" r="50" stroke="#1e293b" stroke-width="10" fill="none"/>
    <circle cx="85" cy="115" r="50" stroke="#10b981" stroke-width="10" stroke-dasharray="314" stroke-dashoffset="230" stroke-linecap="round" fill="none"/>
    <text x="85" y="122" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800" text-anchor="middle">24</text>
    <text x="85" y="138" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">/100</text>

    <!-- Gauge Info -->
    <text x="160" y="85" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Status: Normal (Aman)</text>
    <text x="160" y="110" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Peluang hujan rendah dalam 6 jam ke depan.</text>
    <text x="160" y="130" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Mobilitas perkotaan relatif kondusif dan stabil.</text>

    <!-- Air Quality Sub-Bar -->
    <rect x="24" y="175" width="407" height="42" rx="8" fill="#162238"/>
    <text x="40" y="200" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Indeks Kualitas Udara (AQI / ISPU):</text>
    <text x="340" y="200" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">68 • Sedang</text>
  </g>

  <!-- Bottom: 24h Interactive Chart Simulation -->
  <g transform="translate(30, 335)">
    <rect width="940" height="215" rx="12" fill="url(#cardGrad)" stroke="rgba(148,163,184,0.15)"/>
    <text x="24" y="32" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Prakiraan 24 Jam: Fluktuasi Suhu (°C) &amp; Potensi Curah Hujan (mm)</text>

    <!-- Chart Grid Lines -->
    <line x1="60" y1="65" x2="900" y2="65" stroke="rgba(148,163,184,0.1)"/>
    <line x1="60" y1="110" x2="900" y2="110" stroke="rgba(148,163,184,0.1)"/>
    <line x1="60" y1="155" x2="900" y2="155" stroke="rgba(148,163,184,0.1)"/>

    <!-- Area Chart Gradient & Path -->
    <path d="M70 140 Q 150 150 250 120 T 450 75 T 650 95 T 880 145 L 880 180 L 70 180 Z" fill="url(#chartLineGrad)"/>
    <path d="M70 140 Q 150 150 250 120 T 450 75 T 650 95 T 880 145" stroke="#0ea5e9" stroke-width="3" fill="none"/>
    
    <!-- Data Points -->
    <circle cx="250" cy="120" r="4" fill="#0ea5e9"/>
    <circle cx="450" cy="75" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="650" cy="95" r="4" fill="#0ea5e9"/>

    <!-- Rain Bars in Chart -->
    <rect x="435" y="110" width="12" height="70" rx="3" fill="#fbbf24" opacity="0.6"/>
    <rect x="470" y="125" width="12" height="55" rx="3" fill="#fbbf24" opacity="0.6"/>

    <!-- Time Labels -->
    <text x="70" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">18:00</text>
    <text x="250" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">21:00</text>
    <text x="450" y="196" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">00:00 (Puncak)</text>
    <text x="650" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">06:00</text>
    <text x="860" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">12:00</text>
  </g>
</svg>
